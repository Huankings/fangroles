# fangroles 构建属性。
# 版本号刻意与 Wathe 自改版 / HarpyModLoader / NoellesRoles 对齐（都是 MC 1.21.1 + Yarn build.3），
# 这样 libs 里的本地 jar 与本工程的映射完全一致，不会出现方法名对不上的问题。

# 提升 Gradle 可用内存
org.gradle.jvmargs=-Xmx1G

# ---------------------------------------------------------------------------
# Fabric 平台属性（不要随意改动，改错会导致 remap 失败）
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.17.2

# ---------------------------------------------------------------------------
# 本模组属性
# ---------------------------------------------------------------------------
mod_version=1.0.0-h1.3
maven_group=org.agmas
archives_base_name=fangroles

# ---------------------------------------------------------------------------
# 依赖版本
# 注意：下面的 wathe_version / harpy_mod_loader_version / noelles_roles_version
# 只在 libs/ 目录里找不到对应本地 jar 时才会作为 Maven 回退坐标使用。
# 日常联调请以 libs/ 里手动替换的 jar 为准（见 build.gradle 的 findLatestLocalModJar）。
# ---------------------------------------------------------------------------
fabric_version=0.116.7+1.21.1
cca_version=6.1.1
yacl_version=3.8.0+1.21.1-fabric
ratatouille_version=1.4.3-1.21.1
wathe_version=1.3.3-1.21.1
harpy_mod_loader_version=1.2.3-h1.3
noelles_roles_version=1.6-h1.3
